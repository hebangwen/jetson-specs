<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jetson 系列参数对比</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ampere: #38bdf8;
    --blackwell: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--blackwell));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 16px;
    font-size: 12px;
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 11px;
  }
  th, td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    white-space: nowrap;
  }
  /* 表头 = 参数列名 */
  thead th {
    background: #0b1220;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 4;
    font-size: 11px;
  }
  thead th .unit {
    display: block;
    font-size: 9px;
    color: var(--muted);
    font-weight: 400;
  }
  /* 行名 = 型号（sticky 左侧第一列） */
  tbody th {
    background: #16213a;
    text-align: left;
    font-weight: 500;
    position: sticky;
    left: 0;
    z-index: 2;
    box-shadow: 2px 0 0 var(--border), 6px 0 12px rgba(0,0,0,.5);
    font-size: 11px;
    white-space: nowrap;
  }
  tbody th .arch-badge {
    display: block;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 999px;
    margin-top: 2px;
    width: fit-content;
  }
  .arch-ampere { background: rgba(56,189,248,.15); color: var(--ampere); border: 1px solid rgba(56,189,248,.4); }
  .arch-blackwell { background: rgba(167,139,250,.15); color: var(--blackwell); border: 1px solid rgba(167,139,250,.4); }
  thead th:first-child {
    position: sticky;
    left: 0;
    z-index: 5;
    background: #0b1220;
    box-shadow: 2px 0 0 var(--border);
  }
  tbody tr:hover td { background: rgba(56,189,248,.06); }
  tbody tr:nth-child(even) td { background: rgba(255,255,255,.02); }
  tbody tr:nth-child(even):hover td { background: rgba(56,189,248,.06); }
  tbody tr:hover th { background: #1f2c4d; }
  /* Blackwell 型号整行淡紫背景 */
  tbody tr.row-blackwell td { background: rgba(167,139,250,.04); }
  tbody tr.row-blackwell td.na { background: rgba(167,139,250,.03); }
  .na { color: #475569; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; color: #7dd3fc; }
  .error-box, .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    margin-top: 16px;
    background: var(--card);
  }
  .error-box { color: #fda4af; border-color: rgba(253,164,175,.4); }
</style>
</head>
<body>
  <h1>NVIDIA Jetson 系列参数对比</h1>
  <p class="subtitle">Orin Nano · Orin NX · AGX Orin · Thor —— 数据来源 data.js（单位：T=TFLOPS，G=GB/s）</p>
  <div class="table-wrap">
    <div id="loading" class="loading">正在加载数据...</div>
    <table id="spec-table" style="display:none"></table>
  </div>

<script src="data.js"></script>
<script>
if (typeof JETSON_DATA === 'undefined') {
  document.getElementById('loading').style.display = 'none';
  const box = document.createElement('div');
  box.className = 'error-box';
  box.textContent = '⚠️ data.js 加载失败，请确认 data.js 与 index.html 在同一目录';
  document.querySelector('.table-wrap').appendChild(box);
} else {
  render(JETSON_DATA);
}

function render(data) {
  document.getElementById('loading').style.display = 'none';
  const table = document.getElementById('spec-table');
  table.style.display = '';
  table.innerHTML = '';

  const models = data.models;
  const params = data.params;
  // 展开 GPU 复合字段 → 扁平参数列表（含 name + units + values）
  const flat = expandParams(params);

  // ---- 表头：第一列空，后面是每个参数列 ----
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const corner = document.createElement('th');
  corner.textContent = '型号';
  headRow.appendChild(corner);
  flat.forEach(({ name, unit }) => {
    const th = document.createElement('th');
    th.textContent = name;
    if (unit) {
      const u = document.createElement('span');
      u.className = 'unit';
      u.textContent = unit;
      th.appendChild(u);
    }
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  // ---- 表体：每行一个型号 ----
  const tbody = document.createElement('tbody');
  models.forEach((m, i) => {
    const row = document.createElement('tr');
    const isBlackwell = params['架构'][i] === 'Blackwell';
    if (isBlackwell) row.classList.add('row-blackwell');

    // 行名（型号）
    const th = document.createElement('th');
    th.textContent = m;
    const badge = document.createElement('span');
    badge.className = 'arch-badge ' + (isBlackwell ? 'arch-blackwell' : 'arch-ampere');
    badge.textContent = params['架构'][i];
    th.appendChild(badge);
    row.appendChild(th);

    // 每个参数列
    flat.forEach(({ values }) => {
      const td = document.createElement('td');
      const val = values[i];
      if (isNumeric(val)) {
        td.className = 'num';
        td.textContent = val;
      } else if (val === '-' || val === '—') {
        td.className = 'na';
        td.textContent = '—';
      } else {
        td.textContent = val;
      }
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
}

// 展开 GPU 字段并缩短单位名，返回 [{name, unit, values}]
function expandParams(params) {
  const rows = [];
  for (const [name, values] of Object.entries(params)) {
    // 缩短单位名
    const rename = {
      'FP32 (TFLOPS)':      ['FP32', 'TF'],
      'FP16/BF16 (TFLOPS)': ['FP16/BF16', 'TF'],
      'FP8 (TFLOPS)':       ['FP8', 'TF'],
      'FP4 (TFLOPS)':       ['FP4', 'TF'],
      'INT8 (TOPS)':        ['INT8', 'TF'],
      'DLA INT8 (TOPS)':    ['DLA INT8', 'TF'],
      '内存带宽 (GB/s)':     ['带宽', 'GB/s'],
    };
    if (rename[name]) {
      rows.push({ name: rename[name][0], unit: rename[name][1], values });
    } else if (name === '功耗 (W)') {
      // 暂时隐藏功耗列
      return;
    } else if (name === '内存容量') {
      rows.push({ name: '内存', unit: 'GB', values: values.map(v => extractNum(v)) });
    } else if (name === '内存位宽') {
      rows.push({ name: '位宽', unit: 'bit', values: values.map(v => extractNum(v)) });
    } else if (name === 'CPU') {
      // CPU 拆成「核心数」和「频率」两列
      rows.push({ name: 'CPU 核心', unit: '', values: values.map(v => extractNum(v)) });
      rows.push({ name: 'CPU 频率', unit: 'MHz', values: values.map(v => toMHz(v)) });
    } else if (name !== 'GPU') {
      rows.push({ name, unit: '', values });
    } else {
      // GPU 拆行：每段只保留数值，单位统一到表头
      const parts = values.map(v => String(v).split(/\s*\/\s*/));
      rows.push({ name: 'CUDA 核心', unit: '', values: parts.map(p => extractNum(p[0])) });
      rows.push({ name: 'Tensor 核心', unit: '', values: parts.map(p => extractNum(p[1])) });
      if (parts.some(p => p.length > 3)) {
        rows.push({ name: 'MIG', unit: 'TPC', values: parts.map(p => p.length > 3 ? extractNum(p[2]) : '-') });
      }
      rows.push({ name: '频率', unit: 'MHz', values: parts.map(p => toMHz(p[p.length - 1])) });
    }
  }
  return rows;
}

// 提取字符串中的首个数字（如 "512 CUDA" → "512"、"64 个第五代 Tensor Cores" → "64"）
function extractNum(v) {
  const m = String(v).match(/-?\d+(?:\.\d+)?/);
  return m ? m[0] : '-';
}

// 频率统一换算到 MHz（GHz → ×1000）
function toMHz(v) {
  const s = String(v);
  const m = s.match(/(-?\d+(?:\.\d+)?)\s*(GHz|MHz)/i);
  if (!m) return '-';
  const num = parseFloat(m[1]);
  const val = m[2].toLowerCase() === 'ghz' ? Math.round(num * 1000) : num;
  return String(val);
}

function isNumeric(v) {
  return v !== '' && !isNaN(v) && !isNaN(parseFloat(v)) && String(v).trim() !== '-';
}
</script>
</body>
</html>
