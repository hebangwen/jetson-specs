<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jetson 系列参数对比</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ampere: #38bdf8;
    --blackwell: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--blackwell));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 16px;
    font-size: 12px;
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 11px;
  }
  th, td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    white-space: nowrap;
  }
  /* 表头 = 参数列名 */
  thead th {
    background: #0b1220;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 4;
    font-size: 11px;
  }
  thead th .unit {
    display: block;
    font-size: 9px;
    color: var(--muted);
    font-weight: 400;
  }
  /* 行名 = 型号（sticky 左侧第一列） */
  tbody th {
    background: #16213a;
    text-align: left;
    font-weight: 500;
    position: sticky;
    left: 0;
    z-index: 2;
    box-shadow: 2px 0 0 var(--border), 6px 0 12px rgba(0,0,0,.5);
    font-size: 11px;
    white-space: nowrap;
  }
  tbody th .arch-badge {
    display: block;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 999px;
    margin-top: 2px;
    width: fit-content;
  }
  .arch-ampere { background: rgba(56,189,248,.15); color: var(--ampere); border: 1px solid rgba(56,189,248,.4); }
  .arch-blackwell { background: rgba(167,139,250,.15); color: var(--blackwell); border: 1px solid rgba(167,139,250,.4); }
  thead th:first-child {
    position: sticky;
    left: 0;
    z-index: 5;
    background: #0b1220;
    box-shadow: 2px 0 0 var(--border);
  }
  tbody tr:hover td { background: rgba(56,189,248,.06); }
  tbody tr:nth-child(even) td { background: rgba(255,255,255,.02); }
  tbody tr:nth-child(even):hover td { background: rgba(56,189,248,.06); }
  tbody tr:hover th { background: #1f2c4d; }
  /* Blackwell 型号整行淡紫背景 */
  tbody tr.row-blackwell td { background: rgba(167,139,250,.04); }
  tbody tr.row-blackwell td.na { background: rgba(167,139,250,.03); }
  .na { color: #475569; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; color: #7dd3fc; }
  .error-box, .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    margin-top: 16px;
    background: var(--card);
  }
  .error-box { color: #fda4af; border-color: rgba(253,164,175,.4); }
  .legend {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <h1>NVIDIA Jetson 系列参数对比</h1>
  <p class="subtitle">Orin Nano · Orin NX · AGX Orin · Thor · DRIVE AGX —— 数据来源 data.js（单位：T=TFLOPS，G=GB/s）</p>
  <div class="table-wrap">
    <div id="loading" class="loading">正在加载数据...</div>
    <table id="spec-table" style="display:none"></table>
  </div>
  <p class="legend">* 标记表示该型号或参数未获得 NVIDIA 官方公开确认，数据为第三方报道/推测</p>

<script src="data.js"></script>
<script>
// 定义展示顺序和表头单位；数据原样来自 data.js（不做任何解析）
// 字段名 -> { 显示名, 单位小字 } ；未列出的字段不展示
const COLUMNS = [
  ['架构',               { label: '架构' }],
  ['FP32 (TFLOPS)',      { label: 'FP32', unit: 'TF' }],
  ['FP16/BF16 (TFLOPS)', { label: 'FP16/BF16', unit: 'TF' }],
  ['FP8 (TFLOPS)',       { label: 'FP8', unit: 'TF' }],
  ['FP4 (TFLOPS)',       { label: 'FP4', unit: 'TF' }],
  ['INT8 (TOPS)',        { label: 'INT8', unit: 'TF' }],
  ['DLA INT8 (TOPS)',    { label: 'DLA INT8', unit: 'TF' }],
  ['GPU CUDA 核心',       { label: 'CUDA 核心' }],
  ['GPU Tensor 核心',     { label: 'Tensor 核心' }],
  ['GPU MIG',            { label: 'MIG', unit: 'TPC' }],
  ['GPU 频率 (MHz)',      { label: 'GPU 频率', unit: 'MHz' }],
  ['CPU 核心',           { label: 'CPU 核心' }],
  ['CPU 频率 (MHz)',      { label: 'CPU 频率', unit: 'MHz' }],
  ['内存容量数值 (GB)',    { label: '内存', unit: 'GB' }],
  ['内存位宽 (bit)',       { label: '位宽', unit: 'bit' }],
  ['内存带宽 (GB/s)',     { label: '带宽', unit: 'GB/s' }],
  ['内存类型',            { label: '内存类型' }],
];

if (typeof JETSON_DATA === 'undefined') {
  document.getElementById('loading').style.display = 'none';
  const box = document.createElement('div');
  box.className = 'error-box';
  box.textContent = '⚠️ data.js 加载失败，请确认 data.js 与 index.html 在同一目录';
  document.querySelector('.table-wrap').appendChild(box);
} else {
  render(JETSON_DATA);
}

function render(data) {
  document.getElementById('loading').style.display = 'none';
  const table = document.getElementById('spec-table');
  table.style.display = '';
  table.innerHTML = '';

  const models = data.models;
  const params = data.params;
  const uncertain = data.uncertain_models || [];
  // 展开 GPU 复合字段 → 扁平参数列表（含 name + units + values）
  const flat = expandParams(params);

  // ---- 表头：第一列空，后面是每个参数列 ----
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const corner = document.createElement('th');
  corner.textContent = '型号';
  headRow.appendChild(corner);
  flat.forEach(({ name, unit }) => {
    const th = document.createElement('th');
    th.textContent = name;
    if (unit) {
      const u = document.createElement('span');
      u.className = 'unit';
      u.textContent = unit;
      th.appendChild(u);
    }
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  // ---- 表体：每行一个型号 ----
  const tbody = document.createElement('tbody');
  models.forEach((m, i) => {
    const row = document.createElement('tr');
    const isBlackwell = params['架构'][i] === 'Blackwell';
    if (isBlackwell) row.classList.add('row-blackwell');

    // 行名（型号）；不确定型号加 * 标记
    const th = document.createElement('th');
    th.textContent = m + (data.uncertain_models && data.uncertain_models.includes(m) ? ' *' : '');
    const badge = document.createElement('span');
    badge.className = 'arch-badge ' + (isBlackwell ? 'arch-blackwell' : 'arch-ampere');
    badge.textContent = params['架构'][i];
    th.appendChild(badge);
    row.appendChild(th);

    // 每个参数列；不确定型号的数值加 * 角标
    flat.forEach(({ values }) => {
      const td = document.createElement('td');
      const raw = values[i];
      const uncertainCell = uncertain.includes(m);
      const val = String(raw == null ? '' : raw);
      if (isNumeric(val)) {
        td.className = 'num';
        td.textContent = val + (uncertainCell ? '*' : '');
      } else if (val === '-' || val === '—' || val === '') {
        td.className = 'na';
        td.textContent = uncertainCell ? '—*' : '—';
      } else {
        td.textContent = val + (uncertainCell ? '*' : '');
      }
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
}

function expandParams(params) {
  return COLUMNS.map(([key, meta]) => ({
    name: meta.label,
    unit: meta.unit || '',
    values: params[key],
  }));
}

function isNumeric(v) {
  return v !== '' && !isNaN(v) && !isNaN(parseFloat(v)) && String(v).trim() !== '-';
}
</script>
</body>
</html>
